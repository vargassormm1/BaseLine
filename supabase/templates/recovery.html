<h2>Reset your password</h2>
<p>Tap the button to choose a new password for Baseline.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:12px 22px;border-radius:999px;background:#19B779;color:#0c1f17;font-weight:700;text-decoration:none">Choose a new password</a></p>
<p>The link works once and expires in an hour. If you didn't ask to reset your password, ignore this email: your password stays the same.</p>
