<h2>Confirm your email</h2>
<p>Tap the button to confirm your email and finish creating your Baseline account.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;padding:12px 22px;border-radius:999px;background:#19B779;color:#0c1f17;font-weight:700;text-decoration:none">Confirm email</a></p>
<p>The link works once and expires in an hour. If you didn't sign up for Baseline, ignore this email.</p>
